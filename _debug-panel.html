<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>harness panel</title>
<!-- ============================================================================
     REMOTE HARNESS PANEL v2 — SCAFFOLDING, never ships.
     Copy into the project as _debug-panel.html next to _debug-bus.js, open it in
     a second tab (or on the laptop while the page runs on a phone). It asks
     `harness:__all__` who is there and hosts EVERY harness on the page, one at a
     time, driving each over its `harness:<title>` channel through _debug-bus.js.

     It knows nothing about any project: each harness sends a descriptor and
     this renders whatever it describes.

     v2 rules (why this file was rewritten):
       - BUILD ONCE, PATCH FOREVER. A harness's DOM is built once per descriptor.
         State echoes patch values into the existing inputs; nothing is ever
         rebuilt on a timer. (v1 rebuilt on every echo and tore the colour input
         down under the open OS colour dialog — the picker "never worked".)
       - OWN COLOUR PICKER. No <input type=color>: a swatch opens an inline
         hue strip + saturation/value square + hex field.
       - ONE HARNESS AT A TIME, picked from the LEFT RAIL; only the chosen one
         is shown and the keyboard drives it. The rail also carries the
         page-wide switches (the dev fold badge) and the name of the checkout
         being driven, which under one-worktree-per-chat is the chat.
       - MODE-SCOPED KNOBS. A knob with `modes: [...]` only shows while one of
         those modes is picked. Knobs are bucketed by `group` into collapsible
         sections.
       - PER-KNOB RESET. ↺ on every row: click = last checkpoint, Shift = shipped.
     ======================================================================== -->
<style>
  /* ---- TOKENS -------------------------------------------------------------
     Every colour, face and size in this panel comes from one of these. The
     theme picker at the foot of the rail swaps them wholesale, so a new palette
     or type style is a row in the THEMES / TYPES tables below and nothing else.
     Anything hard-coded here is a bug: it will not follow the theme. */
  :root {
    color-scheme: dark;
    --bg:        #111111;   /* the work area */
    --bg-rail:   #171717;   /* the left rail */
    --bg-el:     #262626;   /* buttons, inputs */
    --bg-el-hi:  #333333;   /* hover */
    --line:      #2a2a2a;   /* dividers */
    --line-el:   #3c3c3c;   /* control borders */
    --text:      #e6e6e6;
    --text-dim:  #8a8a8a;
    --accent:    #77ffdd;   /* live values, the on state */
    --accent-ink:#111111;   /* text on an accent fill */
    --warn:      #ffd54a;   /* the stale-page count */
    --font:      ui-monospace, SFMono-Regular, Menlo, monospace;
    --fs:        12px;
    --lh:        1.45;
    --radius:    5px;
    --label-tt:  none;      /* text-transform for knob/mode labels */
    --label-cap: uppercase; /* ::first-letter — sentence case, never ALL CAPS */
    --label-ls:  0;         /* letter-spacing to match */
    --label-fw:  400;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: var(--fs)/var(--lh) var(--font); }
  button { font: inherit; background: var(--bg-el); color: var(--text);
           border: 1px solid var(--line-el); border-radius: var(--radius);
           padding: 4px 9px; cursor: pointer; line-height: 1.3; }
  button:hover { background: var(--bg-el-hi); }
  button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink);
                                 border-color: var(--accent); }
  button:disabled { opacity: .35; cursor: default; }
  input[type=checkbox] { accent-color: var(--accent); }

  /* ---- shell: left rail + main ---------------------------------------- */
  #shell { display: flex; align-items: stretch; min-height: 100vh; }
  #rail { flex: 0 0 176px; background: var(--bg-rail); border-right: 1px solid var(--line);
          padding: 10px 8px; display: flex; flex-direction: column; gap: 4px;
          position: sticky; top: 0; align-self: flex-start; height: 100vh; overflow-y: auto; }
  /* One harness per row, full width: a vertical list stays readable as harnesses
     accumulate, where a top strip wrapped into an unreadable block. */
  #strip { display: flex; flex-direction: column; gap: 3px; }
  #strip button { border-radius: var(--radius); text-align: left; display: flex;
                  flex-direction: column; gap: 1px; padding: 6px 8px; }
  #strip .pf { font-size: .85em; opacity: .5; display: flex; gap: 5px; align-items: center; }
  #strip .vp { border: 1px solid currentColor; border-radius: 3px; padding: 0 3px;
               font-size: .9em; opacity: .8; }
  #strip button.dormant { opacity: .45; cursor: default; border-style: dashed; }
  #strip button.trashed { opacity: .4; text-decoration: line-through; }
  .bar button.danger { margin-inline-start: auto; color: var(--warn); border-color: transparent;
                       background: none; opacity: .7; }
  .bar button.danger:hover { opacity: 1; background: var(--bg-el); }
  #strip button[aria-selected="true"] .pf { opacity: .55; }
  /* The Element row: pinned above the harnesses, shown once something is picked.
     Not a harness — it is whatever the last Cmd+click / double-tap hit. */
  #inspectRow { border-radius: var(--radius); text-align: left; display: flex; flex-direction: column;
                gap: 1px; padding: 6px 8px; margin-bottom: 8px; border-style: dashed; }
  #inspectRow[hidden] { display: none; }
  #inspectRow .pf { font-size: .85em; opacity: .5; }
  /* Nesting chain: outermost first, so it reads like a path. */
  .crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 0; margin: 8px 0 4px; }
  .crumbs button { padding: 2px 7px; font-size: .95em; border-radius: 4px; }
  .crumbs .sep { opacity: .35; padding: 0 3px; }
  .isum { color: var(--text-dim); font-size: .9em; margin: 0 0 8px; word-break: break-all; }
  .isum b { color: var(--text); font-weight: 500; }
  .row.edited .name::before { content: ''; display: inline-block; width: 6px; height: 6px;
                               border-radius: 50%; background: var(--accent); margin-inline-end: 6px;
                               vertical-align: middle; }
  .hint4 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  .itext { width: 100%; margin-top: 6px; font: inherit; background: var(--bg-el); color: var(--text);
           border: 1px solid var(--line-el); border-radius: 4px; padding: 6px 8px; resize: vertical;
           direction: rtl; unicode-bidi: plaintext; }
  /* Page-wide switches — they belong to the page, not to a harness, so they sit
     under the list rather than inside any one panel. */
  #globals { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line); }
  #globals label { display: flex; gap: 6px; align-items: center; padding: 3px 4px;
                   cursor: pointer; white-space: nowrap; }
  #popOut { width: 100%; margin-top: 8px; font-size: .9em; }
  /* How far the page is behind while auto-reload is off — the ONLY warning there
     is, since nothing is drawn on the page itself. A small count beside the
     switch, not a banner: it has to be noticeable, not loud. Still a button —
     click to catch up. */
  #behind { margin-inline-start: 5px; padding: 0; border: none; background: none;
            color: var(--warn); font-size: .9em; font-weight: 700;
            font-variant-numeric: tabular-nums; }
  #behind:hover { filter: brightness(1.2); text-decoration: underline; }
  #behind:empty { display: none; }
  #main { flex: 1 1 auto; min-width: 0; }
  #flash { position: fixed; top: 10px; right: 12px; z-index: 9; color: var(--accent);
           font-size: .9em; background: var(--bg); padding: 2px 6px; border-radius: 4px; }
  #flash:empty { display: none; }
  #copySheet { position: fixed; inset: 12px; z-index: 20; background: var(--bg-rail);
               border: 1px solid var(--line-el); border-radius: 8px; display: flex;
               flex-direction: column; padding: 10px; gap: 8px; }
  #copySheet .cs-head { display: flex; justify-content: space-between; align-items: center;
                        gap: 8px; color: var(--text-dim); font-size: .9em; }
  #copySheet textarea { flex: 1; font: inherit; background: var(--bg); color: var(--text);
                        border: 1px solid var(--line-el); border-radius: 6px; padding: 8px;
                        resize: none; white-space: pre; }
  .note { color: var(--text-dim); padding: 24px 14px; }
  @media (max-width: 640px) {
    #shell { display: block; }
    #rail { flex: none; width: auto; height: auto; position: static; border-right: none;
            border-bottom: 1px solid var(--line); }
    #strip { flex-direction: row; flex-wrap: wrap; }
    #globals { margin-top: 10px; }
  }

  /* ---- one harness section -------------------------------------------- */
  .h { padding: 0 12px 40px; }
  .h[hidden] { display: none; }
  .bar { position: sticky; top: 0; z-index: 4; background: var(--bg); display: flex; gap: 6px;
         flex-wrap: wrap; align-items: center; padding: 10px 0;
         border-bottom: 1px solid var(--line); }
  .host { font-size: .85em; opacity: .6; margin-inline-start: auto; }
  .host button { padding: 1px 6px; font-size: .85em; }
  .body { display: grid; grid-template-columns: 1fr; gap: 0 24px; padding-top: 8px; }
  @media (min-width: 700px) { .body { grid-template-columns: 1fr 1fr; } .span { grid-column: 1 / -1; } }

  /* A heading is a word with a capital, not a shouted run of letters. */
  .gname { color: var(--text-dim); font-size: .9em; margin: 12px 0 6px; }
  .gname::first-letter { text-transform: uppercase; }
  .seg { display: flex; flex-wrap: wrap; gap: 4px; }
  .seg button { border-radius: 4px; text-transform: var(--label-tt); letter-spacing: var(--label-ls); }
  /* The capital belongs to the WORD, not to the key letter in front of it —
     ::first-letter on the button itself would capitalise the key. It only takes
     on a BLOCK container, so the wrapper has to be inline-block, not a bare
     inline span. */
  .seg button .ml, label.tog .ml { display: inline-block; }
  .seg button .ml::first-letter, label.tog .ml::first-letter { text-transform: var(--label-cap); }
  .seg button .k { opacity: .5; margin-inline-end: 5px; }
  label.tog { display: inline-flex; gap: 4px; align-items: center; margin: 0 14px 6px 0;
              cursor: pointer; text-transform: var(--label-tt); letter-spacing: var(--label-ls); }
  label.tog .k { opacity: .5; }

  details.grp { border-top: 1px solid var(--line); margin-top: 10px; }
  details.grp[hidden] { display: none; }
  details.grp > summary { cursor: pointer; padding: 8px 0; color: var(--text-dim);
                          font-size: .9em; user-select: none; }
  details.grp > summary::first-letter { text-transform: uppercase; }
  details.grp > summary .n { opacity: .6; margin-inline-start: 6px; text-transform: none;
                             letter-spacing: 0; }

  .row { margin: 0 0 14px; }
  .row[hidden] { display: none; }
  .lab { display: flex; align-items: center; gap: 8px; }
  .lab .name { flex: 1; min-width: 0; text-transform: var(--label-tt);
               letter-spacing: var(--label-ls); font-weight: var(--label-fw); }
  .lab .name::first-letter { text-transform: var(--label-cap); }
  .lab .val { color: var(--accent); min-width: 4ch; text-align: right;
              font-variant-numeric: tabular-nums; }
  .lab .rs { padding: 0 6px; font-size: 1.05em; line-height: 1.2; opacity: .55;
             border-color: transparent; background: none; color: var(--text); }
  .lab .rs:hover { opacity: 1; background: var(--bg-el); }
  input[type=range] { width: 100%; margin: 6px 0 0; accent-color: var(--accent); }

  /* ---- colour knob ----------------------------------------------------- */
  .sw { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
  .swatch { width: 40px; height: 28px; border-radius: 4px; border: 1px solid var(--line-el);
            cursor: pointer; padding: 0; background: #000; flex: none; }
  .hex { flex: 1; min-width: 0; font: inherit; background: var(--bg-el); color: var(--text);
         border: 1px solid var(--line-el); border-radius: 4px; padding: 5px 8px;
         text-transform: lowercase; }
  .cp { display: none; margin-top: 8px; padding: 10px; background: var(--bg-rail);
        border: 1px solid var(--line-el); border-radius: 6px; max-width: 260px; }
  .cp.open { display: block; }
  .cp .sv { position: relative; width: 100%; aspect-ratio: 1.6; border-radius: 4px; cursor: crosshair;
            background-image: linear-gradient(to top, #000, transparent), linear-gradient(to right, #fff, transparent);
            touch-action: none; }
  .cp .hue { position: relative; height: 14px; margin-top: 10px; border-radius: 4px; cursor: pointer; touch-action: none;
             background: linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00); }
  .cp .dot { position: absolute; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff;
             box-shadow: 0 0 0 1px #000; transform: translate(-50%, -50%); pointer-events: none; }
  .cp .hue .dot { top: 50%; }
  .cp .presets { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
  .cp .presets button { width: 18px; height: 18px; padding: 0; border-radius: 3px;
                        border: 1px solid var(--line-el); }

  /* ---- the theme picker (compare/) ------------------------------------- */
  #theme { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); }
  #theme summary { cursor: pointer; color: var(--text-dim); font-size: .9em; padding: 2px 4px;
                   user-select: none; list-style: none; }
  #theme summary::-webkit-details-marker { display: none; }
  #theme .set { display: flex; flex-wrap: wrap; gap: 3px; margin: 6px 0 2px; }
  #theme .set button { padding: 2px 6px; font-size: .85em; border-radius: 4px; }
  /* A palette reads as itself: each swatch wears the colours it would apply. */
  #theme .pal { width: 30px; height: 20px; padding: 0; position: relative; overflow: hidden; }
  #theme .pal i { position: absolute; inset: 0; }
  #theme .pal i + i { inset: auto 0 0 0; height: 6px; }
  #theme .hint { color: var(--text-dim); font-size: .8em; padding: 2px 4px 0; opacity: .8; }
</style>

<div id="shell">
  <nav id="rail">
    <button id="inspectRow" hidden><span class="pf">element</span><span id="inspectName">—</span></button>
    <div id="strip"></div>
    <div id="globals">
      <label><input type="checkbox" id="foldBadge"> Fold number</label>
      <label><input type="checkbox" id="autoReload"> Auto-reload<button id="behind"
        title="changes this page has not taken — click to load them"></button></label>
      <button id="popOut" title="open this panel in the desktop browser">Open in browser</button>
      <details id="theme">
        <summary>Look</summary>
        <div class="set" id="palSet"></div>
        <div class="set" id="typeSet"></div>
        <div class="hint" id="themeHint"></div>
      </details>
    </div>
  </nav>
  <main id="main"><span id="flash"></span><div id="host"><p class="note" id="note">
    Looking for the page… Cmd + click (or double-tap on a phone) any element to
    inspect it; harnesses appear here as the page announces them.
  </p></div></main>
</div>

<script src="_debug-bus.js"></script>
<script>
(function () {
  var ONLY = new URLSearchParams(location.search).get('t');   // optional: one harness
  var seen = {};            // title -> Harness
  /* Titles deleted from this tab. A page loaded before the deletion (auto-reload
     is off) keeps announcing the harness — live or dormant — until it reloads;
     the row must not come back in the meantime. In-memory on purpose: a reload
     of this tab forgets it, by which time the file is gone. */
  var trashedTitles = {};
  /* The harness files project.html loads, straight from disk (server.py
     /__harnesses__). Announcements are only believed for files in this list:
     a tab loaded before a deletion keeps announcing the deleted harness until
     it reloads, and the rail must show what EXISTS, not what a stale tab
     remembers. null until the first answer (then everything is believed). */
  var onDisk = null;
  function refreshOnDisk() {
    fetch('/__harnesses__', { cache: 'no-store' }).then(function (r) { return r.json(); })
      .then(function (d) {
        var was = onDisk ? onDisk.join() : '';
        onDisk = d.files || [];
        if (onDisk.join() !== was) prune();
      }).catch(function () {});
  }
  function fileOf(title, file) { return file || ('_debug-' + title + '.js'); }
  function exists(title, file) { return !onDisk || onDisk.indexOf(fileOf(title, file)) >= 0; }
  /* Drop rows whose file has gone since they were listed. */
  function prune() {
    Object.keys(seen).forEach(function (t) {
      var H = seen[t];
      if (!exists(t, H.desc && H.desc.file)) { H.dead = true; remove(H); }
    });
    Object.keys(dormantRows).forEach(function (t) {
      if (!exists(t, dormantRows[t].m.file)) { delete dormantRows[t]; renderStrip(); }
    });
  }
  refreshOnDisk(); setInterval(refreshOnDisk, 3000);
  window.__seen = seen;     // probe hook
  var active = null;        // the harness the strip shows and the keyboard drives
  var ACTKEY = 'hp:remote:active';

  function flash(msg) {
    var f = document.getElementById('flash');
    f.textContent = msg; clearTimeout(flash.t);
    flash.t = setTimeout(function () { f.textContent = ''; }, 1400);
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function btn(label, fn, sel) {
    var b = el('button', null, label);
    if (sel !== undefined) b.setAttribute('aria-selected', !!sel);
    b.onclick = fn;
    return b;
  }

  // ------------------------------------------------------------ colour math --
  function hexToHsv(hex) {
    var m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
    if (!m) return { h: 0, s: 0, v: 0 };
    var n = parseInt(m[1], 16), r = (n >> 16) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
    var max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min, h = 0;
    if (d) {
      if (max === r) h = ((g - b) / d) % 6;
      else if (max === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60; if (h < 0) h += 360;
    }
    return { h: h, s: max ? d / max : 0, v: max };
  }
  function hsvToHex(h, s, v) {
    var c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c, r = 0, g = 0, b = 0;
    if (h < 60) { r = c; g = x; } else if (h < 120) { r = x; g = c; } else if (h < 180) { g = c; b = x; }
    else if (h < 240) { g = x; b = c; } else if (h < 300) { r = x; b = c; } else { r = c; b = x; }
    var to = function (q) { return ('0' + Math.round((q + m) * 255).toString(16)).slice(-2); };
    return '#' + to(r) + to(g) + to(b);
  }

  // ------------------------------------------------------------ history ----
  /* One undo stack for the whole panel: inspector edits and harness knobs alike.
     Cmd+Z / Cmd+Shift+Z (Ctrl on other keyboards). Each entry knows how to undo
     and redo itself by re-sending the message that caused it. Consecutive edits
     to the same key within 800ms merge into one entry — a slider drag is one
     move, not a hundred. */
  var HIST = { past: [], future: [], last: null };
  HIST.push = function (e) {
    var now = Date.now();
    if (HIST.last && HIST.last.key === e.key && now - HIST.last.t < 800) {
      HIST.last.redo = e.redo; HIST.last.t = now;      // merge: keep the first undo, latest redo
    } else {
      HIST.past.push(e); e.t = now; HIST.last = e;
      if (HIST.past.length > 200) HIST.past.shift();
    }
    HIST.future = [];
  };
  HIST.undo = function () {
    var e = HIST.past.pop(); if (!e) return flash('nothing to undo');
    HIST.last = null; e.undo(); HIST.future.push(e); flash('undo · ' + e.label);
  };
  HIST.redo = function () {
    var e = HIST.future.pop(); if (!e) return flash('nothing to redo');
    HIST.last = null; e.redo(); HIST.past.push(e); flash('redo · ' + e.label);
  };
  addEventListener('keydown', function (e) {
    if (!(e.metaKey || e.ctrlKey) || e.altKey) return;
    if (e.key.toLowerCase() !== 'z') return;
    // Inside a text field the field's own undo wins, except in the inspector's
    // text box which routes through the page.
    if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName || '') && !e.target.classList.contains('itext')) return;
    e.preventDefault();
    if (e.shiftKey) HIST.redo(); else HIST.undo();
  }, true);

  // --------------------------------------------------------- clipboard ----
  /* The clipboard API needs a secure context AND a permitted frame — VS Code's
     Simple Browser refuses it. When the write fails the text goes into a sheet
     the user can select and copy by hand, never into an alert (which cannot be
     selected from at all). */
  function toClipboard(text, what, meta) {
    /* Mirror to the dev server: Claude reads _debug-copy.json at the start of
       its next message, so a Copy reaches the chat without a paste. The
       clipboard write still happens — pasting stays possible. */
    try {
      fetch('/__copy__', { method: 'POST', headers: { 'Content-Type': 'application/json' },
             body: JSON.stringify(Object.assign({ from: what, text: text }, meta || {})) })
        .then(function () { flash('sent to Claude · ' + what); }, function () {});
    } catch (e) {}
    var fail = function () { copySheet(text, what); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { flash('copied · ' + what); }, fail);
    } else fail();
  }
  function copySheet(text, what) {
    var old = document.getElementById('copySheet'); if (old) old.remove();
    var wrap = el('div'); wrap.id = 'copySheet';
    var head = el('div', 'cs-head');
    head.appendChild(el('span', null, what + ' — the clipboard was refused here; select all and copy'));
    var x = btn('Close', function () { wrap.remove(); }); head.appendChild(x);
    var ta = el('textarea'); ta.value = text; ta.readOnly = true; ta.spellcheck = false;
    ta.onkeydown = function (e) { e.stopPropagation(); };
    wrap.appendChild(head); wrap.appendChild(ta);
    document.body.appendChild(wrap);
    ta.focus(); ta.select();
    try { document.execCommand('copy'); flash('copied · ' + what); } catch (e) {}
  }

  // ------------------------------------------------------------ colour ----
  /* One colour control for every colour on the panel — a harness knob and an
     inspector property alike. Swatch + hex field, and an inline popover with a
     saturation/value square, a hue strip and the project's own presets. Never
     <input type=color>: the native dialog is unreliable in webviews and on
     phones. Returns { set(hex) } for patching from outside. */
  var PRESETS = ['#ffffff', '#000000', '#888888', '#F9B624', '#454545', '#F024FF', '#6B89FF', '#FF1A94', '#31CE1C'];
  function colorControl(row, o) {
    o = o || {};
    var sw = el('div', 'sw');
    var swatch = el('button', 'swatch'); swatch.title = 'pick';
    var hex = el('input', 'hex'); hex.type = 'text'; hex.spellcheck = false; hex.placeholder = '#rrggbb';
    sw.appendChild(swatch); sw.appendChild(hex); row.appendChild(sw);

    var cp = el('div', 'cp');
    var sv = el('div', 'sv'); var svDot = el('div', 'dot'); sv.appendChild(svDot);
    var hue = el('div', 'hue'); var hueDot = el('div', 'dot'); hue.appendChild(hueDot);
    cp.appendChild(sv); cp.appendChild(hue);
    var presets = el('div', 'presets');
    PRESETS.forEach(function (c) {
      var b = el('button'); b.style.background = c; b.title = c;
      b.onclick = function () { commit(c.toLowerCase()); };
      presets.appendChild(b);
    });
    cp.appendChild(presets);
    row.appendChild(cp);

    var hsv = { h: 0, s: 0, v: 0 };
    function paint() {

  // ------------------------------------------------------------- Harness ----
  function Harness(title) {
    var H = this;

    H.V = null; H.mode = null; H.T = null; H.tab = null; H.off = [];
    H.touched = {};                      // key -> ms of the last local edit
    H.dragging = null;                   // key of the knob under the pointer
    H.ch = HBus('harness:' + title);
    H.seq = 0; H.pending = {};

    H.el = el('section', 'h'); H.el.hidden = true;
    H.bar = el('div', 'bar');
    H.body = el('div', 'body');
    H.el.appendChild(H.bar); H.el.appendChild(H.body);

    /* One HOST per title. Several pages can run the same harness on one bus
       (phone + laptop tab + a headless probe); the first to answer is the host
       and only its state is shown / its commands taken. A host silent for 6 s
       is dropped. */
    H.host = null; H.hostSeen = 0; H.others = {};
    H.send = function (m) { if (H.host) m.to = H.host; H.ch.postMessage(m); };
    H.isHost = function (m) {
      var now = Date.now();
      if (!m.inst) return true;
      if (H.host === m.inst) { H.hostSeen = now; return true; }
      if (!H.host || now - H.hostSeen > 6000) { H.host = m.inst; H.hostSeen = now; H.others = {}; return true; }
      H.others[m.inst] = now;

    H.switchTo = function (inst) { H.host = inst; H.hostSeen = Date.now(); delete H.others[inst]; H.send({ t: 'hello' }); };
    H.adopt = function (m) { H.V = m.V; H.mode = m.mode; H.T = m.T; H.tab = m.tab; H.off = m.off || []; };

    H.knob = function (key) { return H.desc.knobs.filter(function (s) { return s.key === key; })[0]; };
    H.bag = function (key) {

    H.modeOf = function (g) { return H.desc.modeGrouped ? (H.mode && H.mode[g]) || null : H.mode || null; };

    H.live = function (s) {

    H.ch.onmessage = function (ev) {

      if (m.t === 'desc') {

    };

    // ------------------------------------------------------------- hosts --
    H.renderHosts = function () {

         panel; it only matters when a SECOND page is running this harness, and
         then the switch button itself says so. */
      H.hostsEl.textContent = '';
      Object.keys(H.others).forEach(function (id) {
        if (now - H.others[id] > 8000) { delete H.others[id]; return; }
        var b = btn('drive ' + id + ' instead', function () { H.switchTo(id); H.renderHosts(); });
        b.title = 'another page is running this harness — click to drive that one';

      H.bar.appendChild(db);
      H.hostsEl = el('span', 'host'); H.bar.appendChild(H.hostsEl); H.renderHosts();

      var body = H.body; body.textContent = '';

      // tabs (subjects)

        var ts = el('div', 'seg');
        d.tabs.forEach(function (t) {
          var b = btn(t.label, function () { H.tab = t.id; H.send({ t: 'tab', id: t.id }); H.patch(); });

    var hello = setInterval(function () {

  // ------------------------------------------------------------ strip -----
  var strip = document.getElementById('strip');
  function renderStrip() {
    strip.textContent = '';
    Object.keys(dormantRows).forEach(function (t) {
      if (seen[t]) return;
      var m = dormantRows[t].m;
      var b = el('button', 'dormant');
      b.disabled = true;
      b.title = 'exists on the page but only under the ' + m.viewport + ' breakpoint';
      var top = el('span', 'pf');
      if (m.fold) top.appendChild(document.createTextNode(m.fold));
      top.appendChild(el('span', 'vp', m.viewport + ' only'));
      b.appendChild(top); b.appendChild(el('span', null, m.label || t));
      strip.appendChild(b);
    });
    Object.keys(seen).forEach(function (t) {
      var H = seen[t];
      var b = btn('', function () { activate(t); }, active === H);
      if (H.trashed) { b.classList.add('trashed'); b.title = 'queued for deletion — Claude removes it on its next turn'; }
      /* The fold reads first: a list of harnesses is a list of FOLDS, and the
         name alone ("axis-intro") does not say where on the page it lives. */
      var f = H.desc && H.desc.fold;
      var vp = H.desc && H.desc.viewport;
      var top = el('span', 'pf');
      if (f) top.appendChild(document.createTextNode(f));
      /* Which breakpoint this harness tunes. A harness only injects where its
         knobs mean something, so a rail row also says WHERE it is live — and a
         missing row on a desktop is then explained rather than mysterious. */
      if (vp && vp !== 'both') {
        var vpEl = el('span', 'vp', vp);
        vpEl.title = vp === 'mobile' ? 'mobile only — under 600px'
                                     : 'desktop only — 600px and wider';
        top.appendChild(vpEl);
      }
      if (top.childNodes.length) b.appendChild(top);
      b.appendChild(el('span', null, (H.desc && H.desc.label) || t));
      strip.appendChild(b);
    });
  }
  function activate(title) {
    var H = title === '__inspect__' ? INS : seen[title]; if (!H) return;
    active = H;
    Object.keys(seen).forEach(function (t) { seen[t].el.hidden = seen[t] !== H; });
    INS.el.hidden = H !== INS;
    document.getElementById('inspectRow').setAttribute('aria-selected', H === INS);
    // The element pick is transient — never remembered as the tab to reopen.
    if (H !== INS) { try { localStorage.setItem(ACTKEY, title); } catch (e) {} }
    renderStrip();
  }
  function remove(H) {
    H.el.remove(); delete seen[H.title]; clearInterval(H.beat);
    if (active === H) { active = null; var rest = Object.keys(seen); if (rest.length) activate(rest[0]); }
    renderStrip();
  }
  /* A harness that exists on the page but is gated to the OTHER breakpoint.
     Listed greyed, with its breakpoint, so an empty-looking rail says why. A
     dormant row is dropped the moment the real harness answers, and after 6s
     of silence (the page closed). */
  var dormantRows = {};
  function addDormant(m) {
    if (seen[m.title] || trashedTitles[m.title] || !exists(m.title, m.file)) return;
    var d = dormantRows[m.title];
    if (!d) d = dormantRows[m.title] = { m: m, seen: 0 };
    d.seen = Date.now();
    renderStrip();
  }
  setInterval(function () {
    var now = Date.now(), changed = false;
    Object.keys(dormantRows).forEach(function (t) {
      if (now - dormantRows[t].seen > 6000 || seen[t]) { delete dormantRows[t]; changed = true; }
    });
    if (changed) renderStrip();
    // Nothing open in the main area → say what to do, don't sit blank.
    if (!active) showNote(); else { var n = document.getElementById('note'); if (n) n.remove(); }
  }, 2000);
  function showNote() {
    if (document.getElementById('note')) return;
    var n = el('p', 'note'); n.id = 'note';
    n.textContent = Object.keys(dormantRows).length
      ? 'The harnesses on this page only run under another breakpoint. Cmd + click (or double-tap on a phone) any element to inspect it.'
      : 'No harness on the open page. Cmd + click (or double-tap on a phone) any element to inspect it.';
    document.getElementById('host').appendChild(n);
  }

  function add(title, file) {
    if (ONLY && title !== ONLY) return;
    if (trashedTitles[title] || !exists(title, file)) return;
    if (seen[title]) { if (!seen[title].dead) seen[title].send({ t: 'hello' }); return; }
    var note = document.getElementById('note'); if (note) note.remove();
    var H = new Harness(title);
    seen[title] = H;
    document.getElementById('host').appendChild(H.el);
    var want = null; try { want = localStorage.getItem(ACTKEY); } catch (e) {}
    if (!active || want === title) activate(title); else renderStrip();
  }

  /* ---- the element inspector ------------------------------------------------
     Cmd+click (desktop) or a double-tap (phone) on the page picks an
     element; _debug-inspect.js sends its nesting chain here and this section
     shows it: a breadcrumb to choose WHICH level is being styled — a text sits
     inside a card inside a column, and the padding you want is rarely on the
     thing you hit — and then the style controls, Figma-inspector style. Edits
     go back as inline overrides; Copy hands back the visual-edit change-list. */
  var INS = {
    title: '__inspect__',
    ch: HBus('harness:__inspect__'),
    chain: null, i: -1, props: null, edits: {}, rect: null, sel: '',
    host: null,                            // the page whose pick we are editing
    touched: {}, dragging: null,
    desc: { modes: [], toggles: [] },      // so the harness key handler stays quiet
    ui: null
  };

    { id: 'Mono tight', label: 'Mono tight', key: 'e', v: {
      '--font': MONO, '--fs': '11px', '--lh': '1.3',
      '--label-tt': 'none', '--label-cap': 'uppercase', '--label-ls': '0', '--label-fw': '400' } },
    { id: 'Sans', label: 'Sans', key: 't', v: {
      '--font': SANS, '--fs': '13px', '--lh': '1.45',
      '--label-tt': 'none', '--label-cap': 'uppercase', '--label-ls': '0', '--label-fw': '500' } },
    { id: 'Sans bold', label: 'Sans bold', key: 'y', v: {
      '--font': SANS, '--fs': '12.5px', '--lh': '1.5',
      '--label-tt': 'none', '--label-cap': 'uppercase', '--label-ls': '.01em', '--label-fw': '600' } },
    { id: 'All lowercase', label: 'All lowercase', key: 'u', v: {
      '--font': MONO, '--fs': '12px', '--lh': '1.5',
      '--label-tt': 'lowercase', '--label-cap': 'lowercase', '--label-ls': '0', '--label-fw': '400' } },
  ];
  var THEMEKEY = 'hp:remote:look';
  var look = { pal: 'charcoal', type: 'Mono' };
  try { look = JSON.parse(localStorage.getItem(THEMEKEY)) || look; } catch (e) {}

  function applyLook() {
    var st = document.documentElement.style;
    var pal = PALETTES.filter(function (p) { return p.id === look.pal; })[0] || PALETTES[0];
    var typ = TYPES.filter(function (t) { return t.id === look.type; })[0] || TYPES[0];
    Object.keys(pal.v).forEach(function (k) { st.setProperty(k, pal.v[k]); });
    Object.keys(typ.v).forEach(function (k) { st.setProperty(k, typ.v[k]); });
    // Light palettes need the form controls to follow, or the checkboxes and
    // range thumbs stay dark-mode and look pasted on.
    st.setProperty('color-scheme', /paper|bone/.test(pal.id) ? 'light' : 'dark');
    try { localStorage.setItem(THEMEKEY, JSON.stringify(look)); } catch (e) {}
    paintLook();
  }
  function paintLook() {
    var hint = document.getElementById('themeHint');
    var pal = PALETTES.filter(function (p) { return p.id === look.pal; })[0] || PALETTES[0];
    var typ = TYPES.filter(function (t) { return t.id === look.type; })[0] || TYPES[0];
    hint.textContent = pal.label + ' · ' + typ.label;
    Array.prototype.forEach.call(document.querySelectorAll('#palSet button'), function (b) {
      b.setAttribute('aria-selected', b.dataset.id === look.pal);
    });
    Array.prototype.forEach.call(document.querySelectorAll('#typeSet button'), function (b) {
      b.setAttribute('aria-selected', b.dataset.id === look.type);
    });
  }
  (function buildLook() {
    var ps = document.getElementById('palSet');
    PALETTES.forEach(function (p, i) {
      var b = el('button', 'pal');
      b.dataset.id = p.id;
      // The swatch wears the palette: ground, plus a bar of its accent.
      b.title = p.label + '  ·  key ' + ((i + 1) % 10);
      var g = el('i'); g.style.background = p.v['--bg'];
      var acc = el('i'); acc.style.background = p.v['--accent'];
      b.appendChild(g); b.appendChild(acc);
      b.onclick = function () { look.pal = p.id; applyLook(); };
      ps.appendChild(b);
    });
    var ts = document.getElementById('typeSet');
    TYPES.forEach(function (t) {
      var b = btn(t.label, function () { look.type = t.id; applyLook(); });
      b.dataset.id = t.id; b.title = 'key ' + t.key;
      ts.appendChild(b);
    });
    applyLook();
  })();

  /* ---- out to a real browser ----------------------------------------------
     This panel is usually read inside VS Code's Simple Browser, which is a
     sandboxed webview: it refuses window.open outright and has no popup
     permission to grant. So try the window, and when it is refused — or comes
     back as the truthy object a blocker returns and closes itself — put the URL
     on the clipboard instead, which is the one move left. */
  document.getElementById('popOut').onclick = function () {
    var w = null;
    try { w = window.open(location.href, '_blank'); } catch (e) {}
    if (w && !w.closed) { flash('opened'); return; }
    var url = location.href;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(
        function () { flash('URL copied — paste it in your browser'); },
        function () { window.prompt('Open this in your browser:', url); });
    } else {
      window.prompt('Open this in your browser:', url);
    }
  };

  // Discovery. Every harness answers `who` on the shared channel with its title.
  var disc = HBus('harness:__all__');
  disc.onmessage = function (ev) {
    var m = ev.data || {};
    if (m.t !== 'iam') return;
    if (m.inspect) return;               // the element inspector is not a harness
    if (m.page) {                        // the page-wide switches (_debug-bus.js)
      var st = Date.now() - switchTouched > 1200;
      if (typeof m.foldBadge === 'boolean' && st) foldBox.checked = m.foldBadge;
      if (typeof m.autoReload === 'boolean' && st) autoBox.checked = m.autoReload;
      behindEl.textContent = (!m.autoReload && m.behind) ? String(m.behind) : '';
      return;
    }
    if (m.dormant) { addDormant(m); return; }
    lastIam[m.title] = Date.now();
    add(m.title, m.file);
    // Don't fight a click that hasn't been echoed back yet.
    var settled = Date.now() - switchTouched > 1200;
    if (typeof m.foldBadge === 'boolean' && settled) foldBox.checked = m.foldBadge;
    if (typeof m.autoReload === 'boolean' && settled) autoBox.checked = m.autoReload;
    // The number alone — the house standard for counts on screen, same as the
    // fold badge. The tooltip carries what it means.
    behindEl.textContent = (!m.autoReload && m.behind) ? String(m.behind) : '';
  };
  function ask() { disc.postMessage({ t: 'who' }); }
  // A harness whose page no longer loads it (its _debug-*.js was deleted) stops
  // answering `who` — drop it from the rail after 6s of silence instead of
  // keeping a dead row until this tab reloads.
  var lastIam = {};
  setInterval(function () {
    var now = Date.now();
    Object.keys(seen).forEach(function (t) {
      if (t === ONLY) return;
      if (lastIam[t] === undefined) lastIam[t] = now;
      if (now - lastIam[t] > 6000) { remove(seen[t]); delete lastIam[t]; }
    });
  }, 1500);
  ask();
  setInterval(ask, 1500);       // the project tab reloads constantly; re-greet returning harnesses
  if (ONLY) add(ONLY);

  function bye() { Object.keys(seen).forEach(function (k) { seen[k].send({ t: 'bye' }); }); }
  addEventListener('beforeunload', bye);
  addEventListener('pagehide', bye);

  // Close any open colour popover on an outside click.
  addEventListener('pointerdown', function (e) {
    if (e.target.closest('.cp') || e.target.closest('.swatch')) return;
    document.querySelectorAll('.cp.open').forEach(function (o) { o.classList.remove('open'); });
  });

  /* The LOOK picker's keys. Digits 1-9 pick a palette and q w e t y u a type
     style — but only when the open harness has not claimed that key for a mode
     or a toggle, because a harness's own keys always win. `0` is never taken:
     it belongs to "clear the modes". Palettes past the ninth are click-only.
     `r` RELOADS THE PAGE being driven (the site, not this tab) — the one-off
     "show me the latest" without switching auto-reload on. */
  addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName || '')) return;
    var k = e.key, d = active && active.desc;
    if (d && (d.modes.some(function (m) { return m.key === k; })
           || d.toggles.some(function (t) { return t.key === k; }))) return;
    if (k === 'r') { disc.postMessage({ t: 'reloadnow' }); flash('reloading the page'); behindEl.textContent = ''; return; }
    if (/^[1-9]$/.test(k) && PALETTES[Number(k) - 1]) {
      look.pal = PALETTES[Number(k) - 1].id; applyLook(); return;
    }
    var ty = TYPES.filter(function (t) { return t.key === k; })[0];
    if (ty) { look.type = ty.id; applyLook(); }
  });

  // Keys drive the ACTIVE harness: mode keys, toggle keys, 0 = off.
  addEventListener('keydown', function (e) {
    var H = active;
    if (!H || !H.desc || e.metaKey || e.ctrlKey || e.altKey) return;
    if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName || '')) return;
    var k = e.key;
    if (k === 'Escape') { document.querySelectorAll('.cp.open').forEach(function (o) { o.classList.remove('open'); }); return; }
    if (k === '0') {
      H.desc.modeGroups.forEach(function (g) { H.send({ t: 'mode', group: g, id: null }); H.setModeLocal(g, null); });
      return;
    }
    var m = H.desc.modes.filter(function (m) { return m.key === k; })[0];
    if (m) { H.send({ t: 'mode', group: m.group, id: m.id }); H.setModeLocal(m.group, m.id); return; }
    var t = H.desc.toggles.filter(function (t) { return t.key === k; })[0];
    if (t) { H.T = H.T || {}; H.T[t.id] = !H.T[t.id]; H.send({ t: 'toggle', id: t.id, on: H.T[t.id] }); H.patch(); }
  });
})();
</script>
